    <text x="92" y="38" text-anchor="middle" font-family="Arial" font-size="28">🏝️</text>
    <text x="92" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Andaman</text>
    <text x="92" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,183,0,0.9)">Tropical Paradise</text>
    <text x="92" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">From ₹29,999</text>
  </g>


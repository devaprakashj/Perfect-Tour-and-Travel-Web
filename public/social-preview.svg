  </g>

  <!-- ===== BOTTOM STATS BAR ===== -->
  <rect x="112" y="510" width="560" height="82" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Stat 1 -->
  <text x="192" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#FFB700" font-weight="800">500+</text>
  <text x="192" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Happy Travelers</text>

  <!-- Divider -->
  <line x1="310" y1="525" x2="310" y2="580" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Stat 2 -->
  <text x="390" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#FFB700" font-weight="800">50+</text>
  <text x="390" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Destinations</text>

  <!-- Divider -->
  <line x1="480" y1="525" x2="480" y2="580" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Stat 3 -->
  <text x="562" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#FFB700" font-weight="800">10+</text>
  <text x="562" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">Years Experience</text>

  <!-- ===== BOTTOM WEBSITE URL ===== -->
  <text x="112" y="615" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.45)" letter-spacing="1">perfectplannerstours.vercel.app</text>

  <!-- Phone number bottom right -->
  <text x="1088" y="615" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">📞 7339004469 | 8122694469</text>

</svg>

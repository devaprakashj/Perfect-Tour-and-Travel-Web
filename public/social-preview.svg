  <text x="112" y="420" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.92)" font-weight="300" letter-spacing="0.5">Explore the World with Confidence</text>

  <!-- ===== SUB-TAGLINE ===== -->
  <!-- Pill/badge background -->
  <rect x="110" y="448" width="440" height="44" rx="22" fill="rgba(255,183,0,0.18)" stroke="rgba(255,183,0,0.4)" stroke-width="1.5"/>
  <text x="330" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#FFB700" font-weight="600" letter-spacing="1.5">✈  DOMESTIC &amp; INTERNATIONAL PACKAGES</text>


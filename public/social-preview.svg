<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient: deep navy to blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003580;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0057B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A86B;stop-opacity:1" />
    </linearGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle overlay for depth -->
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.35" />
    </linearGradient>
    <!-- Clip path for rounded corners -->
    <clipPath id="roundedFrame">
      <rect width="1200" height="630" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#overlayGrad)" />

  <!-- Decorative circles (top right) -->
  <circle cx="1100" cy="-60" r="280" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="1100" cy="-60" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="1100" cy="-60" r="120" fill="rgba(255,183,0,0.08)" stroke="rgba(255,183,0,0.15)" stroke-width="1.5"/>

  <!-- Decorative circles (bottom left) -->
  <circle cx="80" cy="700" r="260" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="80" cy="700" r="160" fill="none" stroke="rgba(0,168,107,0.12)" stroke-width="1.5"/>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#goldGrad)" />

  <!-- Bottom gold accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#goldGrad)" />

  <!-- Left vertical gold accent line -->
  <rect x="80" y="60" width="4" height="510" rx="2" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- ===== LOGO AREA ===== -->
  <!-- Compass circle background -->
  <circle cx="148" cy="120" r="42" fill="rgba(255,183,0,0.18)" stroke="rgba(255,183,0,0.4)" stroke-width="2"/>
  <!-- Compass icon (simplified SVG) -->
  <g transform="translate(148,120)">
    <!-- Outer ring -->
    <circle r="30" fill="none" stroke="#FFB700" stroke-width="2.5"/>
    <!-- N/S needle -->
    <polygon points="0,-22 5,0 0,4 -5,0" fill="#FFB700"/>
    <polygon points="0,22 5,0 0,-4 -5,0" fill="rgba(255,255,255,0.5)"/>
    <!-- Center dot -->
    <circle r="3.5" fill="white"/>
    <!-- Cardinal points -->
    <text x="0" y="-36" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFB700" font-weight="bold">N</text>
    <text x="38" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.7">E</text>
    <text x="0" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.7">S</text>
    <text x="-38" y="4" text-anchor="middle" font-family="Arial" font-size="10" fill="white" opacity="0.7">W</text>
  </g>

  <!-- Plane icon next to logo -->
  <g transform="translate(205, 108) rotate(-15)">
    <path d="M0,12 L28,0 L24,12 L28,24 Z" fill="#FFB700" opacity="0.9"/>
    <path d="M8,12 L18,6 L20,12 L18,18 Z" fill="white" opacity="0.3"/>
  </g>

  <!-- Company name (logo text) -->
  <text x="250" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="white" letter-spacing="1">Perfect Planners</text>
  <text x="250" y="138" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,183,0,0.9)" letter-spacing="3" font-weight="600">TOURS &amp; TRAVELS</text>

  <!-- Divider line -->

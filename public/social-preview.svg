  <text x="112" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="white" letter-spacing="-1">Perfect Planners</text>
  <text x="112" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="white" letter-spacing="-1">Tours &amp; Travels</text>

  <!-- Gold underline accent under headline -->
  <rect x="112" y="362" width="340" height="5" rx="2.5" fill="url(#goldGrad)"/>


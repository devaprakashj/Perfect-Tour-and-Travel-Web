    <rect width="185" height="115" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="92" y="38" text-anchor="middle" font-family="Arial" font-size="28">🛕</text>
    <text x="92" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Thailand</text>
    <text x="92" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,183,0,0.9)">Amazing Thailand</text>
    <text x="92" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">From ₹40,000</text>
  </g>

  <!-- Card 4 - Dubai -->
  <g transform="translate(905, 215)">
    <rect width="185" height="115" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="92" y="38" text-anchor="middle" font-family="Arial" font-size="28">🌆</text>
    <text x="92" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Dubai</text>
    <text x="92" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,183,0,0.9)">City of Gold</text>
    <text x="92" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">From ₹45,000</text>
  </g>

  <!-- Card 5 - Manali -->
  <g transform="translate(700, 350)">
    <rect width="185" height="115" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="92" y="38" text-anchor="middle" font-family="Arial" font-size="28">🏔️</text>
    <text x="92" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Manali</text>
    <text x="92" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,183,0,0.9)">Snowy Peaks</text>
    <text x="92" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">From ₹18,000</text>
  </g>

  <!-- Card 6 - Singapore -->
  <g transform="translate(905, 350)">
    <rect width="185" height="115" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="92" y="38" text-anchor="middle" font-family="Arial" font-size="28">🦁</text>
    <text x="92" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Singapore</text>
    <text x="92" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,183,0,0.9)">The Lion City</text>
